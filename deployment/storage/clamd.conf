# Private container network only; do not publish TCP 3310 to the Internet.
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
LogTime yes
Foreground yes
MaxThreads 2
StreamMaxLength 6M
MaxFileSize 6M
MaxScanSize 12M
# Preserve signature updates through the persistent definitions volume.
