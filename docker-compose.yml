services:
  postgres:
    image: postgres:16-alpine
    container_name: empire-nigeria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: empire_nigeria
    ports:
      - "5432:5432"
    volumes:
      - empire_nigeria_pgdata:/var/lib/postgresql/data

volumes:
  empire_nigeria_pgdata:
