# Preparation only. Supply a protected production runtime environment file.
services:
  cleanup:
    build:
      context: ../..
      dockerfile: deployment/storage/Dockerfile.cleanup
    restart: unless-stopped
    env_file:
      - ${EMPIRE_STORAGE_ENV_FILE:?Set an absolute path to the protected production runtime environment file}
    environment:
      NODE_ENV: production
    networks:
      - cleanup-egress
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 2m

networks:
  cleanup-egress:
